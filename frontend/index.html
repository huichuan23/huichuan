<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>会穿 · AI 男性穿搭助手</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#f7f5f0;--card:#fff;--ink:#1a1a1a;--muted:#6b6b6b;--border:rgba(0,0,0,0.09);--safe-bg:#e8f5ee;--safe-c:#1d6b44;--tag-bg:#f0ede8;--accent:#c8a96e;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Noto Sans SC',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;}
  header{padding:32px 24px 20px;max-width:980px;margin:0 auto;display:flex;align-items:baseline;gap:12px;}
  .logo{font-family:'Noto Serif SC',serif;font-size:28px;font-weight:700;}
  .logo-sub{font-size:13px;color:var(--muted);}
  .wrap{max-width:980px;margin:0 auto;padding:0 24px 60px;}
  .card{background:var(--card);border-radius:16px;border:1px solid var(--border);}
  .form-card{padding:28px 32px;}
  .section-title{font-size:11px;color:var(--muted);font-weight:500;letter-spacing:.8px;margin-bottom:14px;text-transform:uppercase;}
  .fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:20px;}
  .fields-2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px;}
  .fields-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:20px;}
  .field label{display:block;font-size:11px;color:var(--muted);margin-bottom:5px;font-weight:500;letter-spacing:.3px;}
  .field input,.field select,.field textarea{width:100%;border:1px solid var(--border);border-radius:10px;padding:0 12px;font-size:13px;font-family:inherit;background:var(--bg);color:var(--ink);outline:none;transition:border-color .15s;height:40px;}
  .field textarea{height:72px;padding:10px 12px;resize:none;line-height:1.5;}
  .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--ink);}
  .budget-section{margin-bottom:20px;}
  .budget-total-bar{display:flex;align-items:center;justify-content:space-between;background:var(--tag-bg);border-radius:10px;padding:10px 16px;margin-bottom:14px;}
  .budget-total-label{font-size:12px;color:var(--muted);}
  .budget-total-value{font-size:18px;font-weight:700;font-family:'Noto Serif SC',serif;}
  .budget-sliders{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
  .budget-slider-item{background:var(--bg);border-radius:12px;padding:12px;}
  .slider-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
  .slider-label{font-size:11px;color:var(--muted);font-weight:500;}
  .slider-value{font-size:14px;font-weight:700;font-family:'Noto Serif SC',serif;}
  input[type=range]{width:100%;height:4px;border-radius:2px;background:var(--border);outline:none;-webkit-appearance:none;cursor:pointer;}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--ink);cursor:pointer;}
  .slider-range{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-top:4px;}
  .btn{width:100%;height:48px;background:var(--ink);color:#fff;border:none;border-radius:12px;font-size:15px;font-family:inherit;font-weight:500;cursor:pointer;letter-spacing:1px;transition:opacity .15s;}
  .btn:hover{opacity:.85;}.btn:disabled{opacity:.4;cursor:not-allowed;}
  .ai-status{display:none;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:24px;margin-top:20px;text-align:center;}
  .ai-status.show{display:block;}
  .ai-status-icon{font-size:28px;margin-bottom:10px;}
  .ai-status-text{font-size:14px;color:var(--muted);}
  .ai-thinking{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:8px;}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--ink);animation:bounce 1.2s infinite;}
  .dot:nth-child(2){animation-delay:.2s;}
  .dot:nth-child(3){animation-delay:.4s;}
  @keyframes bounce{0%,80%,100%{transform:scale(0.6);opacity:.4}40%{transform:scale(1);opacity:1}}
  .result{display:none;margin-top:20px;}.result.show{display:block;}
  .ai-summary{background:linear-gradient(135deg,#1a1a1a,#333);color:#fff;border-radius:14px;padding:20px 24px;margin-bottom:20px;}
  .ai-summary-title{font-size:12px;opacity:.6;letter-spacing:.5px;margin-bottom:8px;}
  .ai-summary-text{font-size:14px;line-height:1.7;opacity:.9;}
  .meta-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
  .badge{display:inline-flex;align-items:center;background:var(--card);border:1px solid var(--border);border-radius:20px;padding:5px 12px;font-size:12px;}
  .badge.dark{background:var(--ink);color:#fff;border-color:var(--ink);}
  .tips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px;}
  .tip{background:var(--tag-bg);border-radius:8px;padding:5px 12px;font-size:12px;color:var(--muted);}
  .section-label{font-size:13px;color:var(--muted);font-weight:500;letter-spacing:.5px;margin-bottom:14px;}
  .outfit{margin-bottom:20px;}
  .outfit-head{padding:16px 24px 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
  .outfit-num{font-family:'Noto Serif SC',serif;font-size:13px;color:var(--muted);margin-right:8px;}
  .outfit-name{font-weight:500;font-size:15px;}
  .safe-badge{font-size:11px;font-weight:500;padding:3px 10px;border-radius:20px;background:var(--safe-bg);color:var(--safe-c);}
  .outfit-reason{padding:10px 24px 12px;font-size:13px;color:var(--muted);line-height:1.7;border-bottom:1px solid var(--border);}
  .items{display:grid;grid-template-columns:repeat(3,1fr);}
  .item{padding:18px 14px;border-right:1px solid var(--border);text-align:center;}
  .item:last-child{border-right:none;}
  .img-box{width:110px;height:110px;border-radius:12px;margin:0 auto 10px;overflow:hidden;background:#f8f8f8;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:36px;}
  .img-box img{width:100%;height:100%;object-fit:contain;transition:transform .2s;}
  .img-box img:hover{transform:scale(1.06);}
  .item-cat{font-size:10px;color:var(--muted);margin-bottom:3px;font-weight:500;letter-spacing:.5px;}
  .item-name{font-size:12px;font-weight:500;margin-bottom:2px;line-height:1.4;}
  .item-brand{font-size:11px;color:var(--muted);margin-bottom:4px;}
  .item-price{font-size:16px;font-weight:700;margin-bottom:9px;font-family:'Noto Serif SC',serif;}
  .item-price .cur{font-size:11px;font-weight:400;color:var(--muted);}
  .buy-btn{display:inline-flex;align-items:center;gap:4px;padding:6px 14px;background:var(--ink);color:#fff;border-radius:20px;font-size:11px;font-weight:500;text-decoration:none;transition:opacity .15s;}
  .buy-btn:hover{opacity:.78;}
  .outfit-foot{padding:12px 24px;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;background:var(--bg);border-radius:0 0 16px 16px;}
  .foot-label{font-size:12px;color:var(--muted);}
  .foot-right{display:flex;align-items:center;gap:12px;}
  .foot-budget{font-size:11px;color:var(--muted);}
  .foot-price{font-size:18px;font-weight:700;font-family:'Noto Serif SC',serif;}
  .foot-price.over{color:#c0392b;}
  .tryon-section{padding:28px 32px;margin-top:28px;}
  .tryon-title{font-family:'Noto Serif SC',serif;font-size:19px;font-weight:700;margin-bottom:8px;}
  .tryon-sub{font-size:13px;color:var(--muted);line-height:1.6;margin-bottom:20px;}
  .api-tabs{display:flex;gap:8px;margin-bottom:20px;}
  .api-tab{flex:1;padding:10px;border:1.5px solid var(--border);border-radius:10px;text-align:center;cursor:pointer;font-size:13px;font-weight:500;transition:all .15s;background:var(--bg);}
  .api-tab.active{border-color:var(--ink);background:var(--ink);color:#fff;}
  .api-panel{display:none;}.api-panel.active{display:block;}
  .note-box{font-size:12px;color:var(--muted);background:var(--tag-bg);border-radius:8px;padding:10px 14px;margin-bottom:18px;line-height:1.7;}
  .note-box a{color:var(--ink);}
  .input-label{font-size:11px;color:var(--muted);font-weight:500;letter-spacing:.5px;margin-bottom:6px;}
  .key-input{width:100%;height:40px;border:1px solid var(--border);border-radius:10px;padding:0 12px;font-size:13px;font-family:monospace;background:var(--bg);color:var(--ink);outline:none;margin-bottom:4px;}
  .key-input:focus{border-color:var(--ink);}
  .key-hint{font-size:11px;color:var(--muted);margin-bottom:16px;}
  .sel{width:100%;height:42px;border:1px solid var(--border);border-radius:10px;padding:0 12px;font-size:13px;font-family:inherit;background:var(--bg);color:var(--ink);outline:none;margin-bottom:14px;}
  .tryon-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:14px;}
  .upload-area{border:1.5px dashed var(--border);border-radius:12px;background:var(--bg);padding:16px;text-align:center;cursor:pointer;min-height:160px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;transition:border-color .15s;}
  .upload-area:hover{border-color:var(--ink);}
  .upload-area.filled{border-style:solid;border-color:#aaa;}
  .upload-icon{font-size:26px;}
  .upload-label{font-size:13px;font-weight:500;}
  .upload-hint{font-size:11px;color:var(--muted);}
  .upload-preview{width:100%;height:140px;object-fit:contain;border-radius:8px;display:none;}
  .upload-input{display:none;}
  .photo-btns{display:flex;gap:8px;margin-top:8px;}
  .photo-btn{flex:1;height:36px;border:1px solid var(--border);border-radius:8px;font-size:12px;font-family:inherit;cursor:pointer;background:var(--bg);color:var(--ink);transition:background .15s;}
  .photo-btn:hover{background:#ede9e3;}
  .photo-btn.primary{background:var(--ink);color:#fff;border-color:var(--ink);}
  .photo-btn.primary:hover{opacity:.85;}
  .camera-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:1000;align-items:center;justify-content:center;}
  .camera-modal.show{display:flex;}
  .camera-box{background:var(--card);border-radius:16px;padding:20px;width:90%;max-width:480px;}
  .camera-title{font-size:15px;font-weight:500;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;}
  .camera-close{cursor:pointer;font-size:20px;color:var(--muted);}
  #cameraVideo{width:100%;border-radius:10px;background:#000;}
  .camera-actions{display:flex;gap:10px;margin-top:12px;}
  .camera-snap{flex:1;height:44px;background:var(--ink);color:#fff;border:none;border-radius:10px;font-size:14px;font-family:inherit;cursor:pointer;}
  .camera-cancel{height:44px;padding:0 20px;background:var(--bg);color:var(--ink);border:1px solid var(--border);border-radius:10px;font-size:14px;font-family:inherit;cursor:pointer;}
  .auto-fill-btn{width:100%;height:38px;background:var(--bg);color:var(--ink);border:1px solid var(--border);border-radius:10px;font-size:13px;font-family:inherit;cursor:pointer;margin-bottom:14px;transition:background .15s;}
  .auto-fill-btn:hover{background:#ede9e3;}
  .btn-tryon{width:100%;height:48px;background:var(--ink);color:#fff;border:none;border-radius:12px;font-size:15px;font-family:inherit;font-weight:500;cursor:pointer;transition:opacity .15s;}
  .btn-tryon:hover{opacity:.85;}.btn-tryon:disabled{opacity:.4;cursor:not-allowed;}
  .progress-wrap{display:none;margin-top:18px;}
  .progress-wrap.show{display:block;}
  .progress-label{font-size:13px;color:var(--muted);margin-bottom:8px;}
  .progress-bar-bg{height:5px;background:var(--border);border-radius:3px;overflow:hidden;}
  .progress-bar{height:100%;background:var(--ink);border-radius:3px;width:0%;transition:width .4s;}
  .progress-status{font-size:12px;color:var(--muted);margin-top:6px;}
  .tryon-result{display:none;margin-top:22px;}
  .tryon-result.show{display:block;}
  .result-label-sm{font-size:12px;color:var(--muted);font-weight:500;margin-bottom:10px;}
  .result-box{background:var(--bg);border-radius:12px;border:1px solid var(--border);padding:16px;}
  .compare-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px;}
  .compare-item{text-align:center;}
  .compare-img{width:100%;border-radius:8px;object-fit:contain;max-height:280px;}
  .compare-caption{font-size:11px;color:var(--muted);margin-top:4px;}
  .ai-text{font-size:14px;line-height:1.9;white-space:pre-wrap;}
  .db-badge{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;background:var(--safe-bg);color:var(--safe-c);border-radius:8px;font-size:12px;margin-bottom:16px;}
  .error-box{background:#fff0f0;border:1px solid #ffcccc;border-radius:10px;padding:14px 18px;font-size:13px;color:#c0392b;margin-top:16px;}
  /* 体型分析区域 */
  .body-analysis-section{background:var(--card);border-radius:16px;border:1px solid var(--border);padding:24px 28px;margin-bottom:20px;}
  .body-photo-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px;}
  .body-photo-box{border:1.5px dashed var(--border);border-radius:12px;background:var(--bg);min-height:140px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;transition:border-color .15s;text-align:center;padding:12px;}
  .body-photo-box:hover{border-color:var(--ink);}
  .body-photo-box.filled{border-style:solid;border-color:#aaa;}
  .body-preview{width:100%;max-height:130px;object-fit:contain;border-radius:8px;display:none;}
  .measure-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px;}
  .measure-item label{display:block;font-size:11px;color:var(--muted);margin-bottom:4px;font-weight:500;}
  .measure-item input{width:100%;height:38px;border:1px solid var(--border);border-radius:8px;padding:0 10px;font-size:13px;font-family:inherit;background:var(--bg);color:var(--ink);outline:none;}
  .measure-item input:focus{border-color:var(--ink);}
  .analyze-btn{width:100%;height:44px;background:linear-gradient(135deg,#1a1a1a,#444);color:#fff;border:none;border-radius:10px;font-size:14px;font-family:inherit;font-weight:500;cursor:pointer;margin-bottom:14px;transition:opacity .15s;}
  .analyze-btn:hover{opacity:.85;}.analyze-btn:disabled{opacity:.4;cursor:not-allowed;}
  .analysis-result{background:linear-gradient(135deg,#1a1a1a,#2d2d2d);color:#fff;border-radius:12px;padding:16px 20px;margin-bottom:16px;display:none;}
  .analysis-result.show{display:block;}
  .analysis-result-title{font-size:11px;opacity:.5;letter-spacing:.5px;margin-bottom:8px;}
  .analysis-result-text{font-size:13px;line-height:1.8;opacity:.9;}
  .analysis-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
  .analysis-tag{background:rgba(255,255,255,.12);border-radius:20px;padding:3px 10px;font-size:11px;}
  .step-indicator{display:flex;align-items:center;gap:8px;margin-bottom:18px;}
  .step{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);}
  .step.active{color:var(--ink);font-weight:500;}
  .step-num{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;}
  .step.active .step-num{background:var(--ink);color:#fff;border-color:var(--ink);}
  .step-line{flex:1;height:1px;background:var(--border);}
  @media(max-width:640px){
    .budget-sliders,.fields-3{grid-template-columns:1fr;}
    .fields-2{grid-template-columns:1fr;}
    .items{grid-template-columns:1fr;}
    .item{border-right:none;border-bottom:1px solid var(--border);}
    .item:last-child{border-bottom:none;}
    .tryon-grid,.compare-row{grid-template-columns:1fr;}
    .body-photo-row,.measure-grid{grid-template-columns:1fr;}
    .form-card,.tryon-section{padding:20px;}
    .api-tabs{flex-direction:column;}
  }
</style>
</head>
<body>
<header>
  <span class="logo">会穿</span>
  <span class="logo-sub">AI 男性穿搭助手 · 不踩雷</span>
</header>
<div class="wrap" id="app">
  <div style="text-align:center;padding:60px 0;color:var(--muted)">
    <div style="width:24px;height:24px;border:2px solid var(--border);border-top-color:var(--ink);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 14px"></div>
    <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
    加载中…
  </div>
</div>

<script>
const BACKEND = 'https://huichuan-production.up.railway.app';

let DB = {tops:[], bottoms:[], shoes:[]};
let dbStats = {total:0};

async function loadProducts(){
  try{
    const [r1,r2,r3,rs] = await Promise.all([
      fetch(`${BACKEND}/api/products?limit=100&category=top`),
      fetch(`${BACKEND}/api/products?limit=100&category=bottom`),
      fetch(`${BACKEND}/api/products?limit=100&category=shoes`),
      fetch(`${BACKEND}/api/products/stats`),
    ]);
    const [d1,d2,d3,stats] = await Promise.all([r1.json(),r2.json(),r3.json(),rs.json()]);
    DB.tops    = (d1.products||[]).map(normalizeProduct);
    DB.bottoms = (d2.products||[]).map(normalizeProduct);
    DB.shoes   = (d3.products||[]).map(normalizeProduct);
    dbStats    = stats;
    console.log(`✅ 商品：上衣${DB.tops.length}件，裤子${DB.bottoms.length}件，鞋子${DB.shoes.length}件`);
  }catch(e){ console.error('加载商品失败',e); }
}

function normalizeProduct(p){
  return {
    id:p.id, name:p.name, brand:p.brand||'Amazon', price:p.price,
    color:p.color||'', color_tone:p.color_tone||'medium',
    img:p.img||'', buy:p.buy||'', tags:p.tags||[],
    avoid_body:p.avoid_body||[], category:p.category,
  };
}

function bodyInfo(h,w){
  const b=+(w/Math.pow(h/100,2)).toFixed(1);
  if(b<18.5)return{label:'偏瘦',bmi:b};
  if(b<24)  return{label:'标准',bmi:b};
  if(b<28)  return{label:'略微偏胖',bmi:b};
  return         {label:'偏胖',bmi:b};
}

function preFilter(products,body,budgetLimit){
  return products.filter(p=>{
    if(p.price>budgetLimit)return false;
    if(p.avoid_body&&p.avoid_body.includes(body.label))return false;
    return true;
  }).slice(0,15);
}

async function callBackendRecommend(userInfo){
  const resp=await fetch(`${BACKEND}/api/recommend`,{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({
      height:userInfo.height, weight:userInfo.weight,
      skin:userInfo.skin, face:userInfo.face,
      scene:userInfo.scene, style:userInfo.style,
      dislike:userInfo.dislike||'', existing:userInfo.existing||'',
      desc:userInfo.desc||'', budgets:userInfo.budgets,
      body_analysis: userInfo.bodyAnalysis||'',
      measurements: userInfo.measurements||{},
    }),
  });
  if(!resp.ok){const e=await resp.json();throw new Error(e.detail||`后端错误 ${resp.status}`);}
  const data=await resp.json();
  const outfits=(data.outfits||[]).map(o=>({
    id:o.id, name:o.name, safety:o.safety||'高', reason:o.reason,
    top_id:o.top?.id||o.top_id, bottom_id:o.bottom?.id||o.bottom_id, shoes_id:o.shoes?.id||o.shoes_id,
  }));
  (data.outfits||[]).forEach(o=>{
    if(o.top)   {const p=normalizeProduct(o.top);   if(!DB.tops.find(x=>x.id===p.id))   DB.tops.push(p);}
    if(o.bottom){const p=normalizeProduct(o.bottom);if(!DB.bottoms.find(x=>x.id===p.id))DB.bottoms.push(p);}
    if(o.shoes) {const p=normalizeProduct(o.shoes); if(!DB.shoes.find(x=>x.id===p.id))  DB.shoes.push(p);}
  });
  return {summary:data.summary||'', tips:data.tips||[], outfits, body:data.body};
}

const CAT={top:{label:'上衣',icon:'👕'},bottom:{label:'裤子',icon:'👖'},shoes:{label:'鞋子',icon:'👟'}};
function findProduct(id){return [...DB.tops,...DB.bottoms,...DB.shoes].find(p=>p.id===id);}

function renderResult(aiResult,userInfo){
  const budgetTotal=userInfo.budgets.top+userInfo.budgets.bottom+userInfo.budgets.shoes;
  const tipsHTML=(aiResult.tips||[]).map(t=>`<span class="tip">${t}</span>`).join('');
  const outfitOpts=(aiResult.outfits||[]).map(o=>`<option value="${o.id}">套装${o.id}：${o.name}</option>`).join('');

  const outfitsHTML=(aiResult.outfits||[]).map(o=>{
    const top=findProduct(o.top_id),bottom=findProduct(o.bottom_id),shoe=findProduct(o.shoes_id);
    if(!top||!bottom||!shoe)return '';
    const total=top.price+bottom.price+shoe.price;
    const items=[{cat:'top',p:top},{cat:'bottom',p:bottom},{cat:'shoes',p:shoe}].map(({cat,p})=>`
      <div class="item">
        <div class="img-box">
          <img src="${p.img}" alt="${p.name}" onerror="this.style.display='none';this.nextSibling.style.display='block'">
          <span style="display:none">${CAT[cat].icon}</span>
        </div>

async function analyzeBody(){
  const frontFile=document.getElementById('frontPhotoInput').files[0];
  if(!frontFile){alert('请先上传正面全身照');return;}
  const btn=document.getElementById('analyzeBtn');
  btn.disabled=true; btn.textContent='🔍 AI 分析中…';
  try{
    // 把照片转 base64
    const toB64 = f=>new Promise((res,rej)=>{const r=new FileReader();r.onload=e=>res(e.target.result);r.onerror=rej;r.readAsDataURL(f);});
    const frontB64=await toB64(frontFile);
    const sideFile=document.getElementById('sidePhotoInput').files[0];
    const sideB64=sideFile?await toB64(sideFile):null;

    const chest=document.getElementById('chest').value;
    const waist=document.getElementById('waist').value;
    const hip=document.getElementById('hip').value;
    const h=document.getElementById('height').value||'未填';
    const w=document.getElementById('weight').value||'未填';

    const measureText = (chest||waist||hip)?`胸围${chest||'未填'}cm，腰围${waist||'未填'}cm，臀围${hip||'未填'}cm`:'未提供';

    const messages=[{
      role:'user',
      content:[
        {type:'image',source:{type:'base64',media_type:'image/jpeg',data:frontB64.split(',')[1]}},
        ...(sideB64?[{type:'image',source:{type:'base64',media_type:'image/jpeg',data:sideB64.split(',')[1]}}]:[]),
        {type:'text',text:`你是专业男性体型分析师。请分析这位用户的体型，给出穿搭建议。
用户信息：身高${h}cm，体重${w}kg，三围：${measureText}
请分析：
1. 体型特征（倒三角/标准/略胖/偏瘦等，2-3句话）
2. 适合的版型和款式（具体说明）
3. 应避免的款式（具体说明）
4. 颜色搭配建议
5. 3个最重要的穿搭关键词标签

输出格式：先写分析文字（3-4句话），然后换行写标签，格式：标签：XXX|XXX|XXX`}
      ]
    }];

    const resp=await fetch(`${BACKEND}/api/analyze-body`,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({messages, height:h, weight:w, chest, waist, hip})
    });

    let analysisText='';
    if(resp.ok){
      const d=await resp.json();
      analysisText=d.analysis||'';
    } else {
      // 后端不可用时提示用户
      throw new Error('体型分析服务暂时不可用');
    }

    // 解析标签
    const tagMatch=analysisText.match(/标签[：:]\s*(.+)/);
    const tags=tagMatch?tagMatch[1].split('|').map(t=>t.trim()).filter(Boolean):[];
    const mainText=analysisText.replace(/标签[：:].*$/,'').trim();

    document.getElementById('bodyAnalysisText').textContent=mainText;
    document.getElementById('bodyAnalysisTags').innerHTML=tags.map(t=>`<span class="analysis-tag">${t}</span>`).join('');
    document.getElementById('bodyAnalysisResult').classList.add('show');

    // 存储分析结果供推荐使用
    window._bodyAnalysis=mainText;

    // 更新步骤指示
    document.getElementById('step1').classList.add('active');
    document.getElementById('step2').classList.add('active');
    btn.textContent='✅ 分析完成，可重新分析';

  }catch(e){
    alert('分析失败：'+e.message);
    btn.textContent='🔍 AI 分析我的体型';
  }finally{
    btn.disabled=false;
  }
}

async function runFashn(){
  const key=document.getElementById('fashnKey').value.trim();
  if(!key){alert('请填写 Fashn.ai API Key');return;}
  const personFile=document.getElementById('personInput').files[0];
  if(!personFile){alert('请上传你的照片');return;}
  const garmentFile=document.getElementById('garmentInput').files[0];
  if(!garmentFile&&!window._garmentUrl){alert('请上传衣服图片或点击"自动填入"');return;}

  const btn=document.getElementById('fashnBtn');
  btn.disabled=true;btn.textContent='⏳ 处理中…';
  const prog=document.getElementById('fashnProgress');
  const bar=document.getElementById('fashnBar');
  const status=document.getElementById('fashnStatus');
  prog.classList.add('show');
  let pct=0,mi=0;
  const msgs=['上传图片到服务器…','AI分析人体轮廓…','生成试穿效果…','最后润色…'];
  const timer=setInterval(()=>{pct+=Math.random()*6;if(pct>88)pct=88;bar.style.width=pct+'%';if(mi<msgs.length&&pct>mi*25){status.textContent=msgs[mi];mi++;}},800);

  try{
    status.textContent='上传人物照片…';
    const personUrl=await uploadImageToBackend(personFile);

    let garmentUrl;
    if(garmentFile){
      status.textContent='上传衣服图片…';
      garmentUrl=await uploadImageToBackend(garmentFile);
    } else {
      garmentUrl=window._garmentUrl;
    }

    status.textContent='提交试穿任务…';
    const payload={
      model_name:'tryon-v1.6',
      inputs:{
        model_image: personUrl,
        garment_image: garmentUrl,
        category: 'tops',
        mode: 'balanced'
      }
    };
    console.log('Fashn.ai 请求:', JSON.stringify(payload));

    const r=await fetch('https://api.fashn.ai/v1/run',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':`Bearer ${key}`},
      body:JSON.stringify(payload)
    });

    if(!r.ok){
      const e=await r.json();
      console.error('Fashn.ai 错误响应:', e);
      throw new Error(e.error||e.detail||e.message||JSON.stringify(e)||`HTTP ${r.status}`);
    }

    const runData=await r.json();
    console.log('Fashn.ai 任务创建:', runData);
    const predId=runData.id;
    if(!predId)throw new Error('未获取到任务ID: '+JSON.stringify(runData));

    // 轮询结果
    status.textContent='等待 AI 处理…';
    let output=null;
    for(let i=0;i<40;i++){
      await new Promise(r=>setTimeout(r,3000));
      const poll=await fetch(`https://api.fashn.ai/v1/status/${predId}`,{
        headers:{'Authorization':`Bearer ${key}`}
      });
      const d=await poll.json();
      console.log(`轮询 ${i+1}:`, d.status);
      if(d.status==='completed'){output=d.output;break;}
      if(d.status==='failed')throw new Error('处理失败：'+(d.error||'未知错误'));
    }

    if(!output)throw new Error('处理超时，请重试');
    clearInterval(timer);bar.style.width='100%';
    const resultUrl=Array.isArray(output)?output[0]:output;
    document.getElementById('origImg').src=URL.createObjectURL(personFile);
    document.getElementById('outImg').src=resultUrl;
    document.getElementById('fashnResult').classList.add('show');

  }catch(e){
    clearInterval(timer);
    console.error('试穿失败:', e);
    alert('试穿失败：'+e.message);
  }finally{
    btn.disabled=false;btn.textContent='🤖 开始虚拟试穿';
    setTimeout(()=>{prog.classList.remove('show');bar.style.width='0';},2000);
  }
}

            <button class="photo-btn" onclick="document.getElementById('sidePhotoInput').click()">📁 相册</button>
            <button class="photo-btn primary" onclick="openBodyCamera('side')">📷 拍照</button>
          </div>
        </div>
      </div>
      <p class="section-title" style="margin-bottom:10px">身体三围（可选，帮助精准推荐）</p>
      <div class="measure-grid">
        <div class="measure-item"><label>胸围 (cm)</label><input type="number" id="chest" placeholder="例：90"></div>
        <div class="measure-item"><label>腰围 (cm)</label><input type="number" id="waist" placeholder="例：75"></div>
        <div class="measure-item"><label>臀围 (cm)</label><input type="number" id="hip" placeholder="例：95"></div>
      </div>
      <div class="analysis-result" id="bodyAnalysisResult">
        <div class="analysis-result-title">🤖 AI 体型分析</div>
        <div class="analysis-result-text" id="bodyAnalysisText"></div>
        <div class="analysis-tags" id="bodyAnalysisTags"></div>
      </div>
      <button class="analyze-btn" id="analyzeBtn" onclick="analyzeBody()">🔍 AI 分析我的体型</button>
      <div style="font-size:11px;color:var(--muted);text-align:center">照片仅用于本地分析，不会上传或保存</div>
    </div>

    <div class="card form-card">
      <p class="section-title">第二步：基本信息与偏好</p>
      <div class="fields">
        <div class="field"><label>身高 (cm)</label><input type="number" id="height" value="175" min="150" max="220"></div>
        <div class="field"><label>体重 (kg)</label><input type="number" id="weight" value="70" min="40" max="150"></div>
        <div class="field"><label>肤色</label><select id="skin"><option>普通肤色</option><option>偏白肤色</option><option>偏黄肤色</option><option>偏深肤色</option></select></div>
        <div class="field"><label>脸型</label><select id="face"><option>普通脸型</option><option>圆脸</option><option>长脸</option><option>方脸</option><option>瓜子脸</option></select></div>
        <div class="field"><label>场景</label><select id="scene"><option>日常</option><option>上课</option><option selected>约会</option><option>通勤</option><option>运动</option><option>正式场合</option><option>周末出行</option><option>聚会</option></select></div>
        <div class="field"><label>风格偏好</label><select id="style"><option>简单百搭</option><option selected>干净清爽</option><option>韩系</option><option>日系</option><option>美式休闲</option><option>极简</option><option>街头</option><option>学院风</option><option>工装</option><option>商务休闲</option></select></div>
      </div>
      <div class="fields-2">
        <div class="field"><label>不喜欢的款式（可选）</label><input type="text" id="dislike" placeholder="例：不喜欢卫衣、花哨图案…"></div>

      <div class="field" style="margin-bottom:20px">
        <label>补充描述（可选）</label>

      </div>
      <div class="budget-section">
        <p class="section-title">分类预算设置</p>
        <div class="budget-total-bar">
          <span class="budget-total-label">套装预计总价</span>

        </div>
        <div class="budget-sliders">
          <div class="budget-slider-item">
            <div class="slider-header"><div style="display:flex;align-items:center;gap:6px"><span>👕</span><span class="slider-label">上衣预算</span></div><span class="slider-value" id="topBudgetDisplay">CA$60</span></div>
            <input type="range" id="topBudget" min="20" max="200" step="10" value="60" oninput="updateSlider('top',this.value)">

          </div>
          <div class="budget-slider-item">

            <input type="range" id="bottomBudget" min="20" max="200" step="10" value="80" oninput="updateSlider('bottom',this.value)">
            <div class="slider-range"><span>CA$20</span><span>CA$200+</span></div>
          </div>
          <div class="budget-slider-item">
            <div class="slider-header"><div style="display:flex;align-items:center;gap:6px"><span>👟</span><span class="slider-label">鞋子预算</span></div><span class="slider-value" id="shoesBudgetDisplay">CA$90</span></div>
            <input type="range" id="shoesBudget" min="20" max="250" step="10" value="90" oninput="updateSlider('shoes',this.value)">
            <div class="slider-range"><span>CA$20</span><span>CA$250+</span></div>
          </div>
        </div>
      </div>
      <button class="btn" id="mainBtn" onclick="getRecommend()">🤖 AI 个性化穿搭推荐</button>
    </div>
    <div class="ai-status" id="aiStatus">
      <div class="ai-status-icon">🤖</div>
      <div class="ai-status-text">AI 正在从商品库中为你挑选最佳搭配…</div>
      <div class="ai-thinking"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
    </div>
    <div class="result" id="result"></div>`;
  updateTotal();
}

init();
</script>

<!-- 拍照 Modal -->
<div class="camera-modal" id="cameraModal">
  <div class="camera-box">
    <div class="camera-title">
      <span>📷 拍照</span>
      <span class="camera-close" onclick="closeCamera()">✕</span>
    </div>
    <video id="cameraVideo" autoplay playsinline></video>
    <canvas id="cameraCanvas" style="display:none"></canvas>
    <div class="camera-actions">
      <button class="camera-cancel" onclick="closeCamera()">取消</button>
      <button class="camera-snap" onclick="doSnap()">📸 拍摄</button>
    </div>
  </div>
</div>

<script>
let cameraStream = null;

async function openCamera(){
  const modal = document.getElementById('cameraModal');
  const video = document.getElementById('cameraVideo');
  modal.classList.add('show');
  try {
    cameraStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } }
    });
    video.srcObject = cameraStream;
  } catch(e) {
    alert('无法访问摄像头：' + e.message + '\n请检查浏览器权限设置。');
    modal.classList.remove('show');
  }
}

function closeCamera(){
  if(cameraStream){ cameraStream.getTracks().forEach(t=>t.stop()); cameraStream=null; }
  document.getElementById('cameraModal').classList.remove('show');
  document.getElementById('cameraVideo').srcObject = null;
}

function doSnap(){
  const video = document.getElementById('cameraVideo');
  const canvas = document.getElementById('cameraCanvas');
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  canvas.getContext('2d').drawImage(video, 0, 0);
  const side = window._cameraSide;
  canvas.toBlob(blob => {
    if(!blob) return;
    if(side === 'front' || side === 'side'){
      // 体型照片
      const inputId  = side==='front' ? 'frontPhotoInput' : 'sidePhotoInput';
      const previewId= side==='front' ? 'frontPreview'    : 'sidePreview';
      const boxId    = side==='front' ? 'frontPhotoBox'   : 'sidePhotoBox';
      const file = new File([blob], 'body-photo.jpg', { type: 'image/jpeg' });
      const dt = new DataTransfer(); dt.items.add(file);
      document.getElementById(inputId).files = dt.files;
      const reader = new FileReader();
      reader.onload = e => {
        const img = document.getElementById(previewId);
        const box = document.getElementById(boxId);
        img.src = e.target.result; img.style.display = 'block';
        box.querySelectorAll('div').forEach(el=>el.style.display='none');
        box.classList.add('filled');
      };
      reader.readAsDataURL(blob);
      window._cameraSide = null;
    } else {
      // 试穿人物照片
      const file = new File([blob], 'camera-photo.jpg', { type: 'image/jpeg' });
      const dt = new DataTransfer(); dt.items.add(file);
      document.getElementById('personInput').files = dt.files;
      const reader = new FileReader();
      reader.onload = e => {
        const img = document.getElementById('personPreview');
        const area = document.getElementById('personArea');
        img.src = e.target.result; img.style.display = 'block';
        area.querySelectorAll('.upload-icon,.upload-label,.upload-hint').forEach(el=>el.style.display='none');
        area.classList.add('filled');
      };
      reader.readAsDataURL(blob);
    }
    closeCamera();
  }, 'image/jpeg', 0.92);
}
</script>
</body>
