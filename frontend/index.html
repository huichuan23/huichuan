<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>会穿 · AI 男性穿搭助手</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#f7f5f0;--card:#fff;--ink:#1a1a1a;--muted:#6b6b6b;--border:rgba(0,0,0,0.09);--safe-bg:#e8f5ee;--safe-c:#1d6b44;--tag-bg:#f0ede8;--accent:#c8a96e;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Noto Sans SC',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;}
  header{padding:24px 24px 16px;max-width:980px;margin:0 auto;display:flex;align-items:center;gap:12px;}
  .lang-btn{margin-left:auto;padding:5px 14px;border:1.5px solid var(--border);border-radius:20px;font-size:12px;cursor:pointer;background:var(--card);color:var(--ink);font-family:inherit;transition:all .15s;flex-shrink:0;}
  .lang-btn:hover{border-color:var(--ink);}
  .logo{font-family:'Noto Serif SC',serif;font-size:28px;font-weight:700;}
  .logo-sub{font-size:13px;color:var(--muted);}
  .wrap{max-width:980px;margin:0 auto;padding:0 24px 60px;}
  .card{background:var(--card);border-radius:16px;border:1px solid var(--border);}
  .form-card{padding:28px 32px;}
  .section-title{font-size:11px;color:var(--muted);font-weight:500;letter-spacing:.8px;margin-bottom:14px;text-transform:uppercase;}
  .fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:20px;}
  .fields-2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px;}
  .fields-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:20px;}
  .field label{display:block;font-size:11px;color:var(--muted);margin-bottom:5px;font-weight:500;letter-spacing:.3px;line-height:1.35;}
  .field input,.field select,.field textarea{width:100%;border:1px solid var(--border);border-radius:10px;padding:0 12px;font-size:13px;font-family:inherit;background:var(--bg);color:var(--ink);outline:none;transition:border-color .15s;min-height:40px;}
  .field textarea{height:72px;padding:10px 12px;resize:none;line-height:1.5;}
  .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--ink);}
  .budget-section{margin-bottom:20px;}
  .budget-total-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--tag-bg);border-radius:10px;padding:10px 16px;margin-bottom:14px;}
  .budget-total-label{font-size:12px;color:var(--muted);line-height:1.35;}
  .budget-total-value{font-size:18px;font-weight:700;font-family:'Noto Serif SC',serif;}
  .budget-sliders{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
  .budget-slider-item{background:var(--bg);border-radius:12px;padding:12px;}
  .slider-header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;flex-wrap:wrap;}
  .slider-label{font-size:11px;color:var(--muted);font-weight:500;line-height:1.35;}
  .slider-value{font-size:14px;font-weight:700;font-family:'Noto Serif SC',serif;}
  input[type=range]{width:100%;height:4px;border-radius:2px;background:var(--border);outline:none;-webkit-appearance:none;cursor:pointer;}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--ink);cursor:pointer;}
  .slider-range{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-top:4px;}
  .btn{width:100%;min-height:48px;padding:10px 16px;background:var(--ink);color:#fff;border:none;border-radius:12px;font-size:15px;font-family:inherit;font-weight:500;cursor:pointer;letter-spacing:1px;transition:opacity .15s;line-height:1.35;white-space:normal;}
  .btn:hover{opacity:.85;}.btn:disabled{opacity:.4;cursor:not-allowed;}
  .ai-status{display:none;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:24px;margin-top:20px;text-align:center;}
  .ai-status.show{display:block;}
  .ai-status-icon{font-size:28px;margin-bottom:10px;}
  .ai-status-text{font-size:14px;color:var(--muted);}
  .ai-thinking{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:8px;}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--ink);animation:bounce 1.2s infinite;}
  .dot:nth-child(2){animation-delay:.2s;}
  .dot:nth-child(3){animation-delay:.4s;}
  @keyframes bounce{0%,80%,100%{transform:scale(0.6);opacity:.4}40%{transform:scale(1);opacity:1}}
  .result{display:none;margin-top:20px;}.result.show{display:block;}
  .ai-summary{background:linear-gradient(135deg,#1a1a1a,#333);color:#fff;border-radius:14px;padding:20px 24px;margin-bottom:20px;}
  .ai-summary-title{font-size:12px;opacity:.6;letter-spacing:.5px;margin-bottom:8px;}
  .ai-summary-text{font-size:14px;line-height:1.7;opacity:.9;}
  .meta-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
  .badge{display:inline-flex;align-items:center;background:var(--card);border:1px solid var(--border);border-radius:20px;padding:5px 12px;font-size:12px;}
  .badge.dark{background:var(--ink);color:#fff;border-color:var(--ink);}
  .tips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px;}
  .tip{background:var(--tag-bg);border-radius:8px;padding:5px 12px;font-size:12px;color:var(--muted);}
  .section-label{font-size:13px;color:var(--muted);font-weight:500;letter-spacing:.5px;margin-bottom:14px;}
  .outfit{margin-bottom:20px;}
  .outfit-head{padding:16px 24px 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
  .outfit-num{font-family:'Noto Serif SC',serif;font-size:13px;color:var(--muted);margin-right:8px;}
  .outfit-name{font-weight:500;font-size:15px;}
  .safe-badge{font-size:11px;font-weight:500;padding:3px 10px;border-radius:20px;background:var(--safe-bg);color:var(--safe-c);}
  .outfit-reason{padding:10px 24px 12px;font-size:13px;color:var(--muted);line-height:1.7;border-bottom:1px solid var(--border);}
  .items{display:grid;grid-template-columns:repeat(3,1fr);}
  .item{padding:18px 14px;border-right:1px solid var(--border);text-align:center;}
  .item:last-child{border-right:none;}
  .img-box{width:110px;height:110px;border-radius:12px;margin:0 auto 10px;overflow:hidden;background:#f8f8f8;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:36px;}
  .img-box img{width:100%;height:100%;object-fit:contain;transition:transform .2s;}
  .img-box img:hover{transform:scale(1.06);}
  .item-cat{font-size:10px;color:var(--muted);margin-bottom:3px;font-weight:500;letter-spacing:.5px;}
  .item-name{font-size:12px;font-weight:500;margin-bottom:2px;line-height:1.4;}
  .item-brand{font-size:11px;color:var(--muted);margin-bottom:4px;}
  .item-price{font-size:16px;font-weight:700;margin-bottom:9px;font-family:'Noto Serif SC',serif;}
  .item-price .cur{font-size:11px;font-weight:400;color:var(--muted);}
  .buy-btn{display:inline-flex;align-items:center;gap:4px;padding:6px 14px;background:var(--ink);color:#fff;border-radius:20px;font-size:11px;font-weight:500;text-decoration:none;transition:opacity .15s;}
  .buy-btn:hover{opacity:.78;}
  .outfit-foot{padding:12px 24px;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;background:var(--bg);border-radius:0 0 16px 16px;}
  .foot-label{font-size:12px;color:var(--muted);}
  .foot-right{display:flex;align-items:center;gap:12px;}
  .foot-budget{font-size:11px;color:var(--muted);}
  .foot-price{font-size:18px;font-weight:700;font-family:'Noto Serif SC',serif;}
  .foot-price.over{color:#c0392b;}
  .tryon-section{padding:28px 32px;margin-top:28px;}
  .tryon-title{font-family:'Noto Serif SC',serif;font-size:19px;font-weight:700;margin-bottom:8px;}
  .tryon-sub{font-size:13px;color:var(--muted);line-height:1.6;margin-bottom:20px;}
  .api-tabs{display:flex;gap:8px;margin-bottom:20px;}
  .api-tab{flex:1;padding:10px;border:1.5px solid var(--border);border-radius:10px;text-align:center;cursor:pointer;font-size:13px;font-weight:500;transition:all .15s;background:var(--bg);line-height:1.35;}
  .api-tab.active{border-color:var(--ink);background:var(--ink);color:#fff;}
  .api-panel{display:none;}.api-panel.active{display:block;}
  .note-box{font-size:12px;color:var(--muted);background:var(--tag-bg);border-radius:8px;padding:10px 14px;margin-bottom:18px;line-height:1.7;}
  .note-box a{color:var(--ink);}
  .input-label{font-size:11px;color:var(--muted);font-weight:500;letter-spacing:.5px;margin-bottom:6px;}
  .key-input{width:100%;height:40px;border:1px solid var(--border);border-radius:10px;padding:0 12px;font-size:13px;font-family:monospace;background:var(--bg);color:var(--ink);outline:none;margin-bottom:4px;}
  .key-input:focus{border-color:var(--ink);}
  .key-hint{font-size:11px;color:var(--muted);margin-bottom:16px;}
  .sel{width:100%;height:42px;border:1px solid var(--border);border-radius:10px;padding:0 12px;font-size:13px;font-family:inherit;background:var(--bg);color:var(--ink);outline:none;margin-bottom:14px;}
  .tryon-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:14px;}
  .upload-area{border:1.5px dashed var(--border);border-radius:12px;background:var(--bg);padding:16px;text-align:center;cursor:pointer;min-height:160px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;transition:border-color .15s;}
  .upload-area:hover{border-color:var(--ink);}
  .upload-area.filled{border-style:solid;border-color:#aaa;}
  .upload-icon{font-size:26px;}
  .upload-label{font-size:13px;font-weight:500;}
  .upload-hint{font-size:11px;color:var(--muted);}
  .upload-preview{width:100%;height:140px;object-fit:contain;border-radius:8px;display:none;}
  .upload-input{display:none;}
  .photo-btns{display:flex;gap:8px;margin-top:8px;}
  .photo-btn{flex:1;min-height:36px;padding:8px;border:1px solid var(--border);border-radius:8px;font-size:12px;font-family:inherit;cursor:pointer;background:var(--bg);color:var(--ink);transition:background .15s;line-height:1.3;white-space:normal;}
  .photo-btn:hover{background:#ede9e3;}
  .photo-btn.primary{background:var(--ink);color:#fff;border-color:var(--ink);}
  .photo-btn.primary:hover{opacity:.85;}
  .camera-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:1000;align-items:center;justify-content:center;}
  .camera-modal.show{display:flex;}
  .camera-box{background:var(--card);border-radius:16px;padding:20px;width:90%;max-width:480px;}
  .camera-title{font-size:15px;font-weight:500;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;}
  .camera-close{cursor:pointer;font-size:20px;color:var(--muted);}
  #cameraVideo{width:100%;border-radius:10px;background:#000;}
  .camera-actions{display:flex;gap:10px;margin-top:12px;}
  .camera-snap{flex:1;min-height:44px;padding:9px 14px;background:var(--ink);color:#fff;border:none;border-radius:10px;font-size:14px;font-family:inherit;cursor:pointer;line-height:1.3;white-space:normal;}
  .camera-cancel{min-height:44px;padding:9px 20px;background:var(--bg);color:var(--ink);border:1px solid var(--border);border-radius:10px;font-size:14px;font-family:inherit;cursor:pointer;line-height:1.3;white-space:normal;}
  .auto-fill-btn{width:100%;min-height:38px;padding:9px 12px;background:var(--bg);color:var(--ink);border:1px solid var(--border);border-radius:10px;font-size:13px;font-family:inherit;cursor:pointer;margin-bottom:14px;transition:background .15s;line-height:1.35;white-space:normal;}
  .auto-fill-btn:hover{background:#ede9e3;}
  .btn-tryon{width:100%;min-height:48px;padding:10px 16px;background:var(--ink);color:#fff;border:none;border-radius:12px;font-size:15px;font-family:inherit;font-weight:500;cursor:pointer;transition:opacity .15s;line-height:1.35;white-space:normal;}
  .btn-tryon:hover{opacity:.85;}.btn-tryon:disabled{opacity:.4;cursor:not-allowed;}
  .progress-wrap{display:none;margin-top:18px;}
  .progress-wrap.show{display:block;}
  .progress-label{font-size:13px;color:var(--muted);margin-bottom:8px;}
  .progress-bar-bg{height:5px;background:var(--border);border-radius:3px;overflow:hidden;}
  .progress-bar{height:100%;background:var(--ink);border-radius:3px;width:0%;transition:width .4s;}
  .progress-status{font-size:12px;color:var(--muted);margin-top:6px;}
  .tryon-result{display:none;margin-top:22px;}
  .tryon-result.show{display:block;}
  .result-label-sm{font-size:12px;color:var(--muted);font-weight:500;margin-bottom:10px;}
  .result-box{background:var(--bg);border-radius:12px;border:1px solid var(--border);padding:16px;}
  .compare-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px;}
  .compare-item{text-align:center;}
  .compare-img{width:100%;border-radius:8px;object-fit:contain;max-height:280px;}
  .compare-caption{font-size:11px;color:var(--muted);margin-top:4px;}
  .ai-text{font-size:14px;line-height:1.9;white-space:pre-wrap;}
  .db-badge{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;background:var(--safe-bg);color:var(--safe-c);border-radius:8px;font-size:12px;margin-bottom:16px;}
  .error-box{background:#fff0f0;border:1px solid #ffcccc;border-radius:10px;padding:14px 18px;font-size:13px;color:#c0392b;margin-top:16px;}
  .feedback-card{padding:24px 28px;margin-top:20px;}
  .feedback-title{font-size:18px;font-weight:600;margin-bottom:6px;}
  .feedback-sub{font-size:13px;color:var(--muted);line-height:1.7;margin-bottom:16px;}
  .feedback-grid{display:grid;grid-template-columns:180px 1fr;gap:12px;margin-bottom:12px;}
  .feedback-card select,.feedback-card input,.feedback-card textarea{width:100%;border:1px solid var(--border);border-radius:10px;background:var(--bg);color:var(--ink);font-family:inherit;font-size:14px;outline:none;}
  .feedback-card select,.feedback-card input{height:42px;padding:0 12px;}
  .feedback-card textarea{min-height:96px;padding:12px;resize:vertical;line-height:1.7;}
  .feedback-card select:focus,.feedback-card input:focus,.feedback-card textarea:focus{border-color:var(--ink);}
  .feedback-actions{display:flex;align-items:center;gap:12px;margin-top:12px;flex-wrap:wrap;}
  .feedback-btn{min-height:42px;padding:9px 22px;background:var(--ink);color:#fff;border:none;border-radius:10px;font-size:14px;font-family:inherit;font-weight:500;cursor:pointer;transition:opacity .15s;line-height:1.3;white-space:normal;}
  .feedback-btn:hover{opacity:.86;}
  .feedback-btn:disabled{opacity:.45;cursor:not-allowed;}
  .feedback-status{font-size:12px;color:var(--muted);}
  .feedback-status.ok{color:var(--safe-c);}
  .feedback-status.err{color:#c0392b;}
  /* 体型分析区域 */
  .body-analysis-section{background:var(--card);border-radius:16px;border:1px solid var(--border);padding:24px 28px;margin-bottom:20px;}
  .body-photo-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px;}
  .body-photo-box{border:1.5px dashed var(--border);border-radius:12px;background:var(--bg);min-height:140px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;transition:border-color .15s;text-align:center;padding:12px;}
  .body-photo-box:hover{border-color:var(--ink);}
  .body-photo-box.filled{border-style:solid;border-color:#aaa;}
  .body-preview{width:100%;max-height:130px;object-fit:contain;border-radius:8px;display:none;}
  .measure-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px;}
  .measure-item label{display:block;font-size:11px;color:var(--muted);margin-bottom:4px;font-weight:500;line-height:1.35;}
  .measure-item input{width:100%;height:38px;border:1px solid var(--border);border-radius:8px;padding:0 10px;font-size:13px;font-family:inherit;background:var(--bg);color:var(--ink);outline:none;}
  .measure-item input:focus{border-color:var(--ink);}
  .analyze-btn{width:100%;min-height:44px;padding:9px 14px;background:linear-gradient(135deg,#1a1a1a,#444);color:#fff;border:none;border-radius:10px;font-size:14px;font-family:inherit;font-weight:500;cursor:pointer;margin-bottom:14px;transition:opacity .15s;line-height:1.35;white-space:normal;}
  .analyze-btn:hover{opacity:.85;}.analyze-btn:disabled{opacity:.4;cursor:not-allowed;}
  .analysis-result{background:linear-gradient(135deg,#1a1a1a,#2d2d2d);color:#fff;border-radius:12px;padding:16px 20px;margin-bottom:16px;display:none;}
  .analysis-result.show{display:block;}
  .analysis-result-title{font-size:11px;opacity:.5;letter-spacing:.5px;margin-bottom:8px;}
  .analysis-result-text{font-size:13px;line-height:1.8;opacity:.9;}
  .analysis-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
  .analysis-tag{background:rgba(255,255,255,.12);border-radius:20px;padding:3px 10px;font-size:11px;}
  .step-indicator{display:flex;align-items:center;gap:8px;margin-bottom:18px;}
  /* 整合按钮和进度 */
  .unified-btn{width:100%;min-height:56px;padding:10px 16px;background:linear-gradient(135deg,#1a1a1a,#333);color:#fff;border:none;border-radius:14px;font-size:16px;font-family:inherit;font-weight:500;cursor:pointer;transition:opacity .15s;letter-spacing:.5px;position:relative;line-height:1.35;white-space:normal;}
  .unified-btn:hover{opacity:.88;}.unified-btn:disabled{opacity:.4;cursor:not-allowed;}
  .unified-btn-sub{font-size:11px;opacity:.6;display:block;margin-top:2px;font-weight:400;letter-spacing:0;}
  .progress-steps{display:flex;gap:0;margin-bottom:16px;border-radius:10px;overflow:hidden;border:1px solid var(--border);}
  .progress-step{flex:1;padding:10px 8px;text-align:center;font-size:11px;background:var(--bg);color:var(--muted);border-right:1px solid var(--border);transition:all .3s;min-width:0;}
  .progress-step:last-child{border-right:none;}
  .progress-step.active{background:var(--ink);color:#fff;}
  .progress-step.done{background:#e8f5ee;color:#1d6b44;}
  .progress-step-icon{font-size:16px;display:block;margin-bottom:3px;}
  .progress-step-label{font-size:10px;line-height:1.25;display:block;overflow-wrap:anywhere;}
  .step{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);}
  .step.active{color:var(--ink);font-weight:500;}
  .step-num{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;}
  .step.active .step-num{background:var(--ink);color:#fff;border-color:var(--ink);}
  .step-line{flex:1;height:1px;background:var(--border);}
  /* ── 身体问题多选 ── */
  .body-issues-section{margin-bottom:16px;}
  .body-issues-title{font-size:11px;color:var(--muted);font-weight:500;letter-spacing:.5px;margin-bottom:12px;text-transform:uppercase;}
  /* 分步骤选择 */
  .body-step{margin-bottom:14px;}
  .body-step-label{font-size:12px;font-weight:500;margin-bottom:8px;color:var(--ink);}
  .body-part-btns{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
  .body-part-btn{padding:8px 16px;border:1.5px solid var(--border);border-radius:10px;font-size:13px;cursor:pointer;background:var(--bg);color:var(--ink);transition:all .15s;font-family:inherit;display:flex;align-items:center;gap:5px;line-height:1.3;white-space:normal;}
  .body-part-btn:hover{border-color:var(--ink);}
  .body-part-btn.active{border-color:var(--ink);background:var(--ink);color:#fff;}
  .body-detail-panel{display:none;background:var(--tag-bg);border-radius:12px;padding:14px;margin-bottom:10px;animation:fadeIn .2s ease;}
  .body-detail-panel.show{display:block;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
  .body-detail-group{margin-bottom:10px;}
  .body-detail-group-label{font-size:11px;color:var(--muted);margin-bottom:6px;font-weight:500;}
  .body-issues-grid{display:flex;flex-wrap:wrap;gap:6px;}
  .body-issue-btn{padding:5px 12px;border:1.5px solid var(--border);border-radius:20px;font-size:12px;cursor:pointer;background:var(--card);color:var(--ink);transition:all .15s;font-family:inherit;line-height:1.3;white-space:normal;}
  .body-issue-btn:hover{border-color:var(--ink);}
  .body-issue-btn.selected{background:var(--ink);color:#fff;border-color:var(--ink);}
  .body-issue-btn.advantage{border-color:#1d6b44;color:#1d6b44;background:var(--card);}
  .body-issue-btn.advantage.selected{background:#1d6b44;color:#fff;border-color:#1d6b44;}
  .selected-summary{font-size:11px;color:var(--muted);margin-top:8px;min-height:16px;}
  .selected-tag{display:inline-flex;align-items:center;background:var(--ink);color:#fff;border-radius:12px;padding:2px 8px;font-size:11px;margin:2px;gap:3px;}

  const textMap = lang === 'en' ? textMap_zh : textMap_en;

  // 遍历所有文本节点替换
  function replaceText(node){
    if(node.nodeType === 3){
      let txt = node.textContent;
      let changed = false;
      for(const [from, to] of Object.entries(textMap)){
        if(txt.includes(from)){ txt = txt.split(from).join(to); changed = true; }
      }
      if(changed) node.textContent = txt;
    } else if(node.nodeType === 1 && !['SCRIPT','STYLE','INPUT','TEXTAREA'].includes(node.tagName)){
      node.childNodes.forEach(replaceText);
    }
  }

  // 只替换主要内容区域，避免替换脚本
  const app = document.getElementById('app');

const BACKEND = 'https://huichuan-production.up.railway.app';
let DB = {tops:[], bottoms:[], shoes:[]};
let dbStats = {total:0};

async function loadProducts(){
  try{
    const [r1,r2,r3,rs] = await Promise.all([
      fetch(`${BACKEND}/api/products?limit=200&category=top`),
      fetch(`${BACKEND}/api/products?limit=200&category=bottom`),
      fetch(`${BACKEND}/api/products?limit=200&category=shoes`),
      fetch(`${BACKEND}/api/products/stats`),
    ]);
    const [d1,d2,d3,stats] = await Promise.all([r1.json(),r2.json(),r3.json(),rs.json()]);
    DB.tops    = (d1.products||[]).map(normalizeProduct);
    DB.bottoms = (d2.products||[]).map(normalizeProduct);
    DB.shoes   = (d3.products||[]).map(normalizeProduct);
    dbStats    = stats;
    console.log(`✅ 商品：上衣${DB.tops.length}件，裤子${DB.bottoms.length}件，鞋子${DB.shoes.length}件`);
  }catch(e){ console.error('加载商品失败',e); }
}

function normalizeProduct(p){
  return {
    id:p.id, name:p.name, brand:p.brand||'Amazon', price:p.price,
    color:p.color||'', color_tone:p.color_tone||'medium',
    img:p.img||'', buy:p.buy||'', tags:p.tags||[],
    avoid_body:p.avoid_body||[], category:p.category,
  };
}

function bodyInfo(h,w){
  const b=+(w/Math.pow(h/100,2)).toFixed(1);
  if(b<18.5)return{label:'偏瘦',bmi:b};
  if(b<24)  return{label:'标准',bmi:b};
  if(b<28)  return{label:'略微偏胖',bmi:b};
  return         {label:'偏胖',bmi:b};
}

function preFilter(products,body,budgetLimit){
  return products.filter(p=>{
    if(p.price>budgetLimit)return false;
    if(p.avoid_body&&p.avoid_body.includes(body.label))return false;
    return true;
  }).slice(0,15);
}

async function callBackendRecommend(userInfo){
  const resp=await fetch(`${BACKEND}/api/recommend`,{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({
      height:userInfo.height, weight:userInfo.weight,
      age:userInfo.age||'23-28岁',
      skin:userInfo.skin, face:userInfo.face,
      scene:userInfo.scene, style:userInfo.style,
      dislike:userInfo.dislike||'', existing:userInfo.existing||'',
      desc:userInfo.desc||'', budgets:userInfo.budgets,
      body_analysis: userInfo.bodyAnalysis||'',
      body_issues: userInfo.bodyIssues||[],
      body_issue_rules: userInfo.bodyIssueRules||'',
      measurements: userInfo.measurements||{},
    }),
  });
  if(!resp.ok){const e=await resp.json();throw new Error(e.detail||`后端错误 ${resp.status}`);}
  const data=await resp.json();
  const outfits=(data.outfits||[]).map(o=>({
    id:o.id, name:o.name, safety:o.safety||'高', reason:o.reason,
    top_id:o.top?.id||o.top_id, bottom_id:o.bottom?.id||o.bottom_id, shoes_id:o.shoes?.id||o.shoes_id,
  }));
  (data.outfits||[]).forEach(o=>{
    if(o.top)   {const p=normalizeProduct(o.top);   if(!DB.tops.find(x=>x.id===p.id))   DB.tops.push(p);}
    if(o.bottom){const p=normalizeProduct(o.bottom);if(!DB.bottoms.find(x=>x.id===p.id))DB.bottoms.push(p);}
    if(o.shoes) {const p=normalizeProduct(o.shoes); if(!DB.shoes.find(x=>x.id===p.id))  DB.shoes.push(p);}
  });
  return {summary:data.summary||'', tips:data.tips||[], outfits, body:data.body};
}

const CAT={top:{label:'上衣',icon:'👕'},bottom:{label:'裤子',icon:'👖'},shoes:{label:'鞋子',icon:'👟'}};
function findProduct(id){return [...DB.tops,...DB.bottoms,...DB.shoes].find(p=>p.id===id);}

function renderResult(aiResult,userInfo){

  // Tinder 滑卡数据
  window._swipeOutfits = (aiResult.outfits||[]).map(o=>{
    const top=findProduct(o.top_id),bottom=findProduct(o.bottom_id),shoe=findProduct(o.shoes_id);

async function getRecommend(){
  const h=parseInt(document.getElementById('height').value);
  const w=parseInt(document.getElementById('weight').value);
  if(!h||!w){alert('请填写身高和体重');return;}

  const body=bodyInfo(h,w);
  const budgets={
    top:parseInt(document.getElementById('topBudget').value),
    bottom:parseInt(document.getElementById('bottomBudget').value),
    shoes:parseInt(document.getElementById('shoesBudget').value),
  };

  const measurements={
    chest: document.getElementById('chest')?.value||'',
    waist: document.getElementById('waist')?.value||'',
    hip:   document.getElementById('hip')?.value||'',
    thigh: document.getElementById('thigh')?.value||'',
    calf:  document.getElementById('calf')?.value||'',
  };

  const btn = document.getElementById('mainBtn');
  const statusEl = document.getElementById('aiStatusText');
  btn.disabled=true;
  document.getElementById('aiStatus').classList.add('show');
  document.getElementById('result').classList.remove('show');

  // 更新进度条
  const setStep = (n) => {
    [1,2,3,4].forEach(i=>{
      const el=document.getElementById('step'+i);
      if(!el)return;
      el.classList.remove('active','done');
      if(i<n) el.classList.add('done');
      else if(i===n) el.classList.add('active');
    });
  };

  try{
    // 第一步：体型分析（如果有照片或三围数据）
    let bodyAnalysis = window._bodyAnalysis || '';
    const frontFile = document.getElementById('frontPhotoInput')?.files[0];
    const hasMeasurements = Object.values(measurements).some(v=>v);

    if((frontFile || hasMeasurements) && !bodyAnalysis){
      setStep(1);
      if(statusEl) statusEl.textContent = '🔍 AI 正在分析你的体型…';

      try{
        const toB64 = f=>new Promise((res,rej)=>{const r=new FileReader();r.onload=e=>res(e.target.result);r.onerror=rej;r.readAsDataURL(f);});
        const frontB64 = frontFile ? await toB64(frontFile) : null;

        const resp = await fetch(`${BACKEND}/api/analyze-body`,{
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body:JSON.stringify({
            messages: frontB64 ? [{role:'user',content:[
              {type:'image',source:{type:'base64',media_type:'image/jpeg',data:frontB64.split(',')[1]}},
              {type:'text',text:'分析体型'}
            ]}] : [],
            height: h+'', weight: w+'',
            chest: measurements.chest, waist: measurements.waist,
            hip: measurements.hip, thigh: measurements.thigh, calf: measurements.calf,
          })
        });

        if(resp.ok){
          const d = await resp.json();
          bodyAnalysis = d.analysis || '';
          window._bodyAnalysis = bodyAnalysis;

          // 提取标签显示
          const tagMatch = bodyAnalysis.match(/标签[：:]\s*(.+)/);
          if(tagMatch){
            const tags = tagMatch[1].split('|').map(t=>t.trim()).filter(Boolean);
            const mainText = bodyAnalysis.replace(/标签[：:].*$/,'').trim();
            const analysisEl = document.getElementById('bodyAnalysisResult');
            const textEl = document.getElementById('bodyAnalysisText');
            const tagsEl = document.getElementById('bodyAnalysisTags');
            if(analysisEl){ analysisEl.classList.add('show'); }
            if(textEl){ textEl.textContent = mainText; }
            if(tagsEl){ tagsEl.innerHTML = tags.map(t=>`<span class="analysis-tag">${t}</span>`).join(''); }
          }
        }
      }catch(e){
        console.warn('体型分析失败，跳过:', e);
      }
    }

    // 第二步：构建用户信息
    setStep(2);
    if(statusEl) statusEl.textContent = '📊 整理你的身体特征和偏好…';
    await new Promise(r=>setTimeout(r,300));

    const userInfo={
      height:h, weight:w, body:body.label, bmi:body.bmi,
      age:document.getElementById('age').value,
      skin:document.getElementById('skin').value,
      face:document.getElementById('face').value,
      scene:document.getElementById('scene').value,
      style:document.getElementById('style').value,
      dislike:document.getElementById('dislike').value,
      existing:document.getElementById('existing').value,
      desc:document.getElementById('desc').value,
      budgets,
      bodyAnalysis,
      bodyIssues: Array.from(window._selectedIssues||[]),
      bodyIssueRules: window._bodyIssueRules||'',
      measurements,
    };
    window._lastUserInfo = userInfo;

    // 第三步：AI 推荐
    setStep(3);
    if(statusEl) statusEl.textContent = '🤖 AI 正在从商品库中为你挑选穿搭…';

    const aiResult = await callBackendRecommend(userInfo);

    // 完成
    setStep(4);
    if(statusEl) statusEl.textContent = '✅ 推荐完成！';
    await new Promise(r=>setTimeout(r,400));

    document.getElementById('aiStatus').classList.remove('show');
    renderResult(aiResult, userInfo);

  }catch(e){
    document.getElementById('aiStatus').classList.remove('show');
    [1,2,3,4].forEach(i=>{
      const el=document.getElementById('step'+i);
      if(el){ el.classList.remove('active','done'); if(i===1) el.classList.add('active'); }
    });
    alert('推荐失败：'+e.message);
    console.error(e);
  }finally{
    btn.disabled=false;
  }
}

window._selectedIssues = new Set();
window._activeParts = new Set();

// 切换部位面板
function togglePart(part){
  const btn = document.getElementById('partBtn-' + part);
  const panel = document.getElementById('panel-' + part);
  if(!btn || !panel) return;

  if(window._activeParts.has(part)){
    window._activeParts.delete(part);
    btn.classList.remove('active');
    panel.classList.remove('show');
  } else {
    window._activeParts.add(part);
    btn.classList.add('active');
    panel.classList.add('show');
  }
}

function toggleIssue(btn){
  const issue = btn.dataset.issue;
  if(window._selectedIssues.has(issue)){
    window._selectedIssues.delete(issue);
    btn.classList.remove('selected');
  } else {
    window._selectedIssues.add(issue);
    btn.classList.add('selected');
  }
  updateSelectedSummary();
  updateBodyRules();
}

function removeIssue(issue){
  window._selectedIssues.delete(issue);
  // 取消对应按钮的选中状态
  const btn = document.querySelector(`.body-issue-btn[data-issue="${issue}"]`);
  if(btn) btn.classList.remove('selected');
  updateSelectedSummary();
  updateBodyRules();
}

const ADVANTAGE_ISSUES = new Set(['leg_long','waist_thin','shoulder_good','body_fit','tall','abs','arm_muscle','face_small','skin_white','hip_ratio']);

function updateSelectedSummary(){
  const el = document.getElementById('selectedSummary');
  if(!el) return;
  const issues = Array.from(window._selectedIssues);
  if(!issues.length){ el.innerHTML=''; return; }
  el.innerHTML = issues.map(i => {
    const isAdv = ADVANTAGE_ISSUES.has(i);
    return `<span class="selected-tag${isAdv?' adv':''}">${ISSUE_LABELS[i]||i}<span class="selected-tag-x" onclick="removeIssue('${i}')">×</span></span>`;
  }).join('');
}

function updateBodyRules(){
  const issues = Array.from(window._selectedIssues);
  const preview = document.getElementById('bodyRulesPreview');
  if(!preview) return;

  // 同时根据三围自动推断
  const thigh = parseInt(document.getElementById('thigh')?.value)||0;
  const waist = parseInt(document.getElementById('waist')?.value)||0;
  const hip   = parseInt(document.getElementById('hip')?.value)||0;

  const autoIssues = [];
  if(thigh > 60) autoIssues.push('大腿偏粗（根据腿围数据）');
  if(waist > 90) autoIssues.push('腰围偏大（根据三围数据）');
  if(hip > 105)  autoIssues.push('臀围偏大（根据三围数据）');

  if(issues.length === 0 && autoIssues.length === 0){
    preview.classList.remove('show');
    return;
  }

  const rules = [];
  issues.forEach(issue => {
    const r = BODY_RULES[issue];
    if(!r) return;
    const avoidParts = [...r.avoid_tops, ...r.avoid_bottoms, ...r.avoid_shoes].filter(Boolean);
    const preferParts = [...r.prefer_tops, ...r.prefer_bottoms].filter(Boolean);
    if(avoidParts.length){
      rules.push(`<div class="rule-item"><span class="rule-icon">⚠️</span><span><b>${r.label}</b>：避免 ${avoidParts.slice(0,3).join('、')}</span></div>`);
    }
    if(preferParts.length){
      rules.push(`<div class="rule-item"><span class="rule-icon">✅</span><span><b>${r.label}</b>：推荐 ${preferParts.slice(0,3).join('、')}</span></div>`);
    }
  });

  autoIssues.forEach(a => {
    rules.push(`<div class="rule-item"><span class="rule-icon">📏</span><span>${a}</span></div>`);
  });

  preview.innerHTML = '<div style="font-weight:500;margin-bottom:8px;font-size:12px">🎯 AI 将根据以下规则为你选品：</div>' + rules.join('');
  preview.classList.add('show');

  // 存储供推荐使用
  window._bodyIssueRules = generateIssuePrompt(issues);
}

function generateIssuePrompt(issues){
  if(!issues.length) return '';
  const prompts = issues.map(i => BODY_RULES[i]?.prompt).filter(Boolean);
  const avoidBottoms = new Set();
  const preferBottoms = new Set();
  const avoidTops = new Set();
  const preferTops = new Set();
  const avoidShoes = new Set();

  issues.forEach(i => {
    const r = BODY_RULES[i];
    if(!r) return;
    r.avoid_bottoms.forEach(x => avoidBottoms.add(x));
    r.prefer_bottoms.forEach(x => preferBottoms.add(x));
    r.avoid_tops.forEach(x => avoidTops.add(x));
    r.prefer_tops.forEach(x => preferTops.add(x));
    r.avoid_shoes.forEach(x => avoidShoes.add(x));
  });

  return {
    prompts,
    avoid_bottoms: [...avoidBottoms],
    prefer_bottoms: [...preferBottoms],
    avoid_tops: [...avoidTops],
    prefer_tops: [...preferTops],
    avoid_shoes: [...avoidShoes],
  };
}

// ── 同步体型照片到试穿区 ────────────────────────────────
function syncBodyPhotoToTryon(){
  const frontFile = document.getElementById('frontPhotoInput')?.files[0];
  const personPreview = document.getElementById('personPreview');
  const personArea = document.getElementById('personArea');
  const personHint = document.getElementById('personHint');
  const personBtns = document.getElementById('personBtns');
  if(!personPreview) return;

  if(frontFile){
    // 直接用体型照片
    const reader = new FileReader();
    reader.onload = e => {
      personPreview.src = e.target.result;
      personPreview.style.display = 'block';
      if(personArea) personArea.style.cursor = 'default';
      // 也把文件塞进 personInput
      const dt = new DataTransfer(); dt.items.add(frontFile);
      const pi = document.getElementById('personInput');
      if(pi) pi.files = dt.files;
    };
    reader.readAsDataURL(frontFile);
  } else {
    // 没有体型照片，显示上传按钮
    personPreview.style.display = 'none';
    if(personHint){ personHint.style.display='block'; }
    if(personBtns){ personBtns.style.display='flex'; }
    if(personArea){ personArea.style.cursor='pointer';
      personArea.onclick = ()=>document.getElementById('personInput').click(); }
  }
}

      </div>
      <div class="card-outfit-total${over?' over':''}">合计 CA$${item.total.toFixed(2)}${over?' ⚠️超预算':''}</div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;padding:10px 16px 14px;">
      <a href="${top.buy}" target="_blank" class="buy-btn" style="justify-content:center;font-size:10px">上衣 ↗</a>
      <a href="${bottom.buy}" target="_blank" class="buy-btn" style="justify-content:center;font-size:10px">裤子 ↗</a>

    </div>

function initSwipe(){
  const outfits = window._swipeOutfits || [];
  if(!outfits.length) return;
  window._budgetTotal = (window._lastUserInfo?.budgets?.top||0)
    + (window._lastUserInfo?.budgets?.bottom||0)
    + (window._lastUserInfo?.budgets?.shoes||0);

  const container = document.getElementById('swipeContainer');
  if(!container) return;

  // 渲染所有卡片（后面的在下面）
  container.innerHTML = '';
  [...outfits].reverse().forEach((item,ri)=>{
    const idx = outfits.length - 1 - ri;
    const div = document.createElement('div');
    div.innerHTML = buildCard(item, idx, outfits.length);
    const card = div.firstElementChild;
    // 堆叠效果
    const offset = (outfits.length - 1 - idx) * 4;
    card.style.transform = `scale(${1 - offset*0.02}) translateY(${offset*2}px)`;
    card.style.zIndex = idx + 1;
    container.appendChild(card);
    bindSwipe(card, idx);
  });
  updateSwipeCounter();
}

function updateSwipeCounter(){
  const outfits = window._swipeOutfits || [];
  const idx = window._swipeIdx || 0;
  const el = document.getElementById('swipeCounter');
  if(!el) return;
  if(idx >= outfits.length){
    el.textContent = '已看完全部套装';
    const container = document.getElementById('swipeContainer');
    if(container){
      container.innerHTML = `<div class="done-card">
        <div class="done-icon">🎉</div>
        <div class="done-title">全部看完了！</div>
        <div class="done-sub">已喜欢 ${window._likedOutfits.length} 套</div>
        <button class="btn" style="width:auto;padding:0 24px" onclick="restartSwipe()">重新看一遍</button>
      </div>`;
    }
  } else {
    el.textContent = `第 ${idx+1} 套 / 共 ${outfits.length} 套`;
  }
}

function restartSwipe(){
  window._swipeIdx = 0;
  initSwipe();
}

function swipeCard(dir){
  const idx = window._swipeIdx;
  const outfits = window._swipeOutfits || [];
  if(idx >= outfits.length) return;

    window._swipeIdx++;
    updateSwipeCounter();

    const nextCard = document.getElementById(`card-${window._swipeIdx}`);

function bindSwipe(card, idx){
  let startX=0, startY=0, curX=0, isDragging=false;

  const onStart = e => {
    if(window._swipeIdx !== idx) return;
    isDragging = true;
    startX = (e.touches?e.touches[0].clientX:e.clientX);
    startY = (e.touches?e.touches[0].clientY:e.clientY);
    card.classList.add('dragging');
  };
  const onMove = e => {
    if(!isDragging) return;
    curX = (e.touches?e.touches[0].clientX:e.clientX) - startX;
    const rot = curX * 0.08;
    card.style.transform = `translateX(${curX}px) rotate(${rot}deg)`;
    const likeStamp = card.querySelector('.swipe-stamp.like');
    const nopeStamp = card.querySelector('.swipe-stamp.nope');
    if(likeStamp) likeStamp.style.opacity = Math.min(curX/80, 1);
    if(nopeStamp) nopeStamp.style.opacity = Math.min(-curX/80, 1);
  };
  const onEnd = () => {
    if(!isDragging) return;
    isDragging = false;
    card.classList.remove('dragging');
    if(curX > 80)       swipeCard('right');
    else if(curX < -80) swipeCard('left');
    else {
      card.style.transform = '';
      card.style.transition = 'transform .3s';
      setTimeout(()=>card.style.transition='', 300);
      const likeStamp = card.querySelector('.swipe-stamp.like');
      const nopeStamp = card.querySelector('.swipe-stamp.nope');
      if(likeStamp) likeStamp.style.opacity = '0';
      if(nopeStamp) nopeStamp.style.opacity = '0';
    }
    curX = 0;
  };

  card.addEventListener('mousedown', onStart);
  card.addEventListener('mousemove', onMove);
  card.addEventListener('mouseup', onEnd);
  card.addEventListener('mouseleave', onEnd);
  card.addEventListener('touchstart', onStart, {passive:true});
  card.addEventListener('touchmove', onMove, {passive:true});
  card.addEventListener('touchend', onEnd);
}

async function runFashn(){
  const key=document.getElementById('fashnKey').value.trim();
  if(!key){alert('请填写 Fashn.ai API Key');return;}
  // 优先用 personInput，其次用体型照片
  let personFile=document.getElementById('personInput').files[0];
  if(!personFile){
    const frontFile=document.getElementById('frontPhotoInput')?.files[0];
    if(frontFile){ personFile=frontFile; }
    else{ alert('请上传你的照片或在第一步上传体型照片');return; }
  }
  const garmentFile=document.getElementById('garmentInput').files[0];
  if(!garmentFile&&!window._garmentUrl){alert('请上传衣服图片或点击"自动填入"');return;}

  const btn=document.getElementById('fashnBtn');
  btn.disabled=true;btn.textContent='⏳ 处理中…';
  const prog=document.getElementById('fashnProgress');
  const bar=document.getElementById('fashnBar');
  const status=document.getElementById('fashnStatus');
  prog.classList.add('show');
  let pct=0,mi=0;
  const msgs=['上传图片到服务器…','AI分析人体轮廓…','生成试穿效果…','最后润色…'];
  const timer=setInterval(()=>{pct+=Math.random()*6;if(pct>88)pct=88;bar.style.width=pct+'%';if(mi<msgs.length&&pct>mi*25){status.textContent=msgs[mi];mi++;}},800);

  try{
    status.textContent='上传人物照片…';
    const personUrl=await uploadImageToBackend(personFile);

    let garmentUrl;
    if(garmentFile){
      status.textContent='上传衣服图片…';
      garmentUrl=await uploadImageToBackend(garmentFile);
    } else {
      garmentUrl=window._garmentUrl;
    }

    status.textContent='提交试穿任务…';
    const payload={
      model_name:'tryon-v1.6',
      inputs:{
        model_image: personUrl,
        garment_image: garmentUrl,
        category: 'tops',
        mode: 'balanced'
      }
    };
    console.log('Fashn.ai 请求:', JSON.stringify(payload));

    const r=await fetch('https://api.fashn.ai/v1/run',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':`Bearer ${key}`},
      body:JSON.stringify(payload)
    });

    if(!r.ok){
      const e=await r.json();
      console.error('Fashn.ai 错误响应:', e);
      throw new Error(e.error||e.detail||e.message||JSON.stringify(e)||`HTTP ${r.status}`);
    }

    const runData=await r.json();
    console.log('Fashn.ai 任务创建:', runData);
    const predId=runData.id;
    if(!predId)throw new Error('未获取到任务ID: '+JSON.stringify(runData));

    // 轮询结果
    status.textContent='等待 AI 处理…';
    let output=null;
    for(let i=0;i<40;i++){
      await new Promise(r=>setTimeout(r,3000));
      const poll=await fetch(`https://api.fashn.ai/v1/status/${predId}`,{
        headers:{'Authorization':`Bearer ${key}`}
      });
      const d=await poll.json();
      console.log(`轮询 ${i+1}:`, d.status);
      if(d.status==='completed'){output=d.output;break;}
      if(d.status==='failed')throw new Error('处理失败：'+(d.error||'未知错误'));
    }

    if(!output)throw new Error('处理超时，请重试');
    clearInterval(timer);bar.style.width='100%';
    const resultUrl=Array.isArray(output)?output[0]:output;
    document.getElementById('origImg').src=URL.createObjectURL(personFile);
    document.getElementById('outImg').src=resultUrl;
    document.getElementById('fashnResult').classList.add('show');

  }catch(e){
    clearInterval(timer);
    console.error('试穿失败:', e);
    alert('试穿失败：'+e.message);
  }finally{
    btn.disabled=false;btn.textContent='🤖 开始虚拟试穿';
    setTimeout(()=>{prog.classList.remove('show');bar.style.width='0';},2000);
  }
}

async function submitFeedback(){
  const typeEl = document.getElementById('feedbackType');
  const contactEl = document.getElementById('feedbackContact');
  const messageEl = document.getElementById('feedbackMessage');
  const statusEl = document.getElementById('feedbackStatus');
  const btn = document.getElementById('feedbackBtn');
  const message = (messageEl?.value || '').trim();

  if(!message){
    statusEl.textContent = '请先写一点反馈内容';
    statusEl.className = 'feedback-status err';
    messageEl?.focus();
    return;
  }

  btn.disabled = true;
  statusEl.textContent = '正在提交...';
  statusEl.className = 'feedback-status';

  try{
    const resp = await fetch(`${BACKEND}/api/feedback`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        feedback_type: typeEl?.value || 'general',
        contact: contactEl?.value || '',
        message,
        page: location.href,
        user_agent: navigator.userAgent,
      }),
    });
    if(!resp.ok){
      const err = await resp.json().catch(()=>({}));
      throw new Error(err.detail || `提交失败 ${resp.status}`);
    }
    messageEl.value = '';
    statusEl.textContent = '收到啦，谢谢你的反馈';
    statusEl.className = 'feedback-status ok';
  }catch(err){
    statusEl.textContent = err.message || '提交失败，请稍后再试';
    statusEl.className = 'feedback-status err';
  }finally{
    btn.disabled = false;
  }
}

init();

let cameraStream = null;

async function openCamera(){
  const modal = document.getElementById('cameraModal');
  const video = document.getElementById('cameraVideo');
  modal.classList.add('show');
  try {
    cameraStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } }
    });
    video.srcObject = cameraStream;
  } catch(e) {
    alert('无法访问摄像头：' + e.message + '\n请检查浏览器权限设置。');
    modal.classList.remove('show');
  }
}

function closeCamera(){
  if(cameraStream){ cameraStream.getTracks().forEach(t=>t.stop()); cameraStream=null; }
  document.getElementById('cameraModal').classList.remove('show');
  document.getElementById('cameraVideo').srcObject = null;
}

function doSnap(){
  const video = document.getElementById('cameraVideo');
  const canvas = document.getElementById('cameraCanvas');
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  canvas.getContext('2d').drawImage(video, 0, 0);
  const side = window._cameraSide;
  canvas.toBlob(blob => {
    if(!blob) return;
    if(side === 'front' || side === 'side'){
      // 体型照片
      const inputId  = side==='front' ? 'frontPhotoInput' : 'sidePhotoInput';
      const previewId= side==='front' ? 'frontPreview'    : 'sidePreview';
      const boxId    = side==='front' ? 'frontPhotoBox'   : 'sidePhotoBox';
      const file = new File([blob], 'body-photo.jpg', { type: 'image/jpeg' });
      const dt = new DataTransfer(); dt.items.add(file);
      document.getElementById(inputId).files = dt.files;
      const reader = new FileReader();
      reader.onload = e => {
        const img = document.getElementById(previewId);
        const box = document.getElementById(boxId);
        img.src = e.target.result; img.style.display = 'block';
        box.querySelectorAll('div').forEach(el=>el.style.display='none');
        box.classList.add('filled');
      };
      reader.readAsDataURL(blob);
      window._cameraSide = null;
    } else {
      // 试穿人物照片
      const file = new File([blob], 'camera-photo.jpg', { type: 'image/jpeg' });
      const dt = new DataTransfer(); dt.items.add(file);
      document.getElementById('personInput').files = dt.files;
      const reader = new FileReader();
      reader.onload = e => {
        const img = document.getElementById('personPreview');
        const area = document.getElementById('personArea');
        img.src = e.target.result; img.style.display = 'block';
        area.querySelectorAll('.upload-icon,.upload-label,.upload-hint').forEach(el=>el.style.display='none');
        area.classList.add('filled');
      };
      reader.readAsDataURL(blob);
    }
    closeCamera();
  }, 'image/jpeg', 0.92);
}
